name: Latest blog posts

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: 'https://joaoguedes.net/rss.xml'
          max_post_count: 5
          template: '- [$title]($url) <sub>$date</sub>'
          date_format: 'mmm d, yyyy'
